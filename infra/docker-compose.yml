name: routcontrol

x-db-env: &db-env
  DB_NAME: ${DB_NAME:-routcontrol}
  DB_OWNER_USER: ${DB_OWNER_USER:-rc_owner}
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-rc_owner-dev}
  DB_APP_USER: ${DB_APP_USER:-rc_app}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:-rc_app-dev}

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      <<: *db-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/20-routcontrol-roles.sh:/docker-entrypoint-initdb.d/20-routcontrol-roles.sh:ro
    healthcheck:
      # Por TCP y contra la base de la app: durante el script de inicio, el servidor temporal solo
      # escucha por socket y la base todavía no existe, y pg_isready por socket ya da "listo".
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d ${DB_NAME:-routcontrol} -tAc 'select 1'"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *db-env
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  # Tareas periódicas (Celery worker + beat): cierre automático de jornadas olvidadas (ADR-010).
  # No arranca con `up` por defecto (memoria): `docker compose --profile workers up worker`.
  worker:
    build: ../backend
    profiles: ["workers"]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *db-env
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config worker -B -l info --concurrency 1

  # Armar mi ruta (ADR-015): OSRM (tiempos por calle) y VROOM (orden de las paradas), autoalojados.
  # Preparar los datos una vez: infra/routing/prepare.sh. No arrancan por defecto (memoria):
  #   docker compose -f infra/docker-compose.yml --profile routing up -d osrm vroom
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: ["routing"]
    volumes:
      - ../map-data/routing:/data:ro
    command: osrm-routed --algorithm mld /data/amba.osrm
    ports:
      - "5000:5000"

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    profiles: ["routing"]
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./routing/vroom-conf:/conf
    depends_on:
      - osrm
    ports:
      - "3000:3000"

volumes:
  pgdata:
