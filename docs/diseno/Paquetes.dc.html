<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis paquetes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A78BFA}a:hover{color:#C4B5FD}
input::placeholder{color:#7F8AB8}
input:focus{outline:none;border-color:#7C5CFF !important;box-shadow:0 0 0 4px rgba(124,92,255,.28)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #070B1F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5FF; display: flex; flex-direction: column">
<header style="padding: 56px 20px 14px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, #121A45 0%, #070B1F 100%)">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Mis paquetes</h1>
<span style="font-size: 14px; color: #A3AED6">9 de 24 entregados</span>
</div>
<a href="Escanear.dc.html" aria-label="Escanear paquete" style="width: 52px; height: 52px; border-radius: 16px; background: #7C5CFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(124,92,255,.40)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg></a>
</div>
<div style="position: relative">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar paquete</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3AED6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 14px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="q" type="search" placeholder="Buscar por dirección, nombre o código" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 14px; border: 1.5px solid #5A67B0; background: #11183A; color: #F3F5FF; font-family: inherit; font-size: 15px; padding: 0 16px 0 46px">
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #F3F5FF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</header>
<main style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="5">
<a href="Ficha.dc.html" style="padding: 14px; border-radius: 18px; background: #11183A; border: 1px solid #1F2860; display: flex; gap: 14px; align-items: center; text-decoration: none; color: #F3F5FF">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{p.numBg}}; color: {{p.numFg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">{{p.n}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.addr}}</span>
<span style="font-size: 13px; color: #A3AED6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.who}}</span>
</span>
<span style="flex-shrink: 0; height: 26px; padding: 0 10px; border-radius: 999px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">{{p.state}}</span>
</a>
</sc-for>
</main>
<nav aria-label="Navegación principal" style="margin: 0 16px 24px; height: 72px; border-radius: 24px; background: #11183A; border: 1px solid #1F2860; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
<a href="Jornada.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #A3AED6; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Inicio</a>
<a href="Paquetes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #C4B5FD; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="m3 8 9 5 9-5"></path><path d="M12 13v8"></path></svg>Paquetes</a>
<a href="Recorrido.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #A3AED6; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>Recorridos</a>
<a href="Paquetes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #A3AED6; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { f: 'pend' };
}
renderVals() {
const all = [
{ n: '10', addr: 'Av. San Martín 1450', who: 'Lucía Fernández · a 650 m', s: 'pend' },
{ n: '11', addr: 'Belgrano 322, 2.º B', who: 'Martín Ruiz · a 1,1 km', s: 'pend' },
{ n: '12', addr: 'Rivadavia 980', who: 'Comercio · a 1,4 km', s: 'retry' },
{ n: '13', addr: 'Mitre 77', who: 'Sofía Gómez · a 2 km', s: 'pend' },
{ n: '9', addr: 'Sarmiento 2210', who: 'Entregado 13:42', s: 'ok' },
{ n: '8', addr: 'Moreno 455', who: 'Nadie respondió 13:10', s: 'fail' },
{ n: '7', addr: 'Laprida 1801', who: 'Entregado 12:55', s: 'ok' }
];
const style = {
pend: { state: 'Pendiente', badgeBg: '#1A2350', badgeFg: '#D5DBF7', numBg: 'linear-gradient(140deg, #4D8DFF, #7C5CFF)', numFg: '#FFFFFF' },
ok: { state: 'Entregado', badgeBg: 'rgba(52,211,153,.14)', badgeFg: '#6EE7B7', numBg: 'rgba(52,211,153,.14)', numFg: '#6EE7B7' },
fail: { state: 'No entregado', badgeBg: 'rgba(251,191,36,.14)', badgeFg: '#FCD34D', numBg: 'rgba(251,191,36,.14)', numFg: '#FCD34D' },
retry: { state: '2.º intento', badgeBg: 'rgba(167,139,250,.18)', badgeFg: '#C4B5FD', numBg: 'linear-gradient(140deg, #4D8DFF, #7C5CFF)', numFg: '#FFFFFF' }
};
const f = this.state.f;
const match = (s) => f === 'all' || (f === 'pend' ? (s === 'pend' || s === 'retry') : f === s);
const chipDefs = [['pend', 'Pendientes · 15'], ['ok', 'Entregados · 9'], ['fail', 'No entregados · 2'], ['retry', '2.º intento · 1'], ['all', 'Todos · 24']];
return {
items: all.filter((p) => match(p.s)).map((p) => ({ ...p, ...style[p.s] })),
chips: chipDefs.map(([k, label]) => ({ label, border: f === k ? '#7C5CFF' : '#2A3470', bg: f === k ? 'rgba(124,92,255,.22)' : '#11183A', pick: () => this.setState({ f: k }) }))
};
}
}
</script>
</body>
</html>
