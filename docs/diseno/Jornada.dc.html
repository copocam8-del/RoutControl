<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { secs: 2 * 3600 + 14 * 60 + 36 };
}
componentDidMount() {
this.timer = setInterval(() => this.setState({ secs: this.state.secs + 1 }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const s = this.state.secs;
const p = (n) => String(n).padStart(2, '0');
return { clock: p(Math.floor(s / 3600)) + ':' + p(Math.floor((s % 3600) / 60)) + ':' + p(s % 60) };
}
}
</script>
