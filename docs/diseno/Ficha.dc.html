<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha de entrega</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A78BFA}a:hover{color:#C4B5FD}
@keyframes rcOpen{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
.rc-open{animation:rcOpen .3s ease-out both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #070B1F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5FF; display: flex; flex-direction: column">
<div style="position: relative; height: 190px; flex-shrink: 0; background: #0C1230; overflow: hidden">
<svg width="390" height="190" viewBox="0 0 390 190" role="img" aria-label="Mapa con la ubicación del domicilio y la tuya" style="display: block">
<path d="M-10 150 C 90 130, 170 180, 400 130" stroke="#13306B" stroke-width="18" fill="none"></path>
<g stroke="#1B2452" stroke-width="10" fill="none"><path d="M0 60 H390"></path><path d="M0 120 H390"></path><path d="M80 0 V190"></path><path d="M200 0 V190"></path><path d="M320 0 V190"></path></g>
<path d="M80 180 L80 120 L200 120 L200 100" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9" fill="none"></path>
<circle cx="80" cy="180" r="8" fill="#4D8DFF" stroke="#FFFFFF" stroke-width="3"></circle>
<path d="M200 100 c-11 0 -18 -8 -18 -18 c0 -13 18 -29 18 -29 s18 16 18 29 c0 10 -7 18 -18 18Z" fill="#7C5CFF" stroke="#FFFFFF" stroke-width="3"></path>
<circle cx="200" cy="80" r="5" fill="#FFFFFF"></circle>
</svg>
<a href="Ruta.dc.html" aria-label="Volver" style="position: absolute; left: 20px; top: 48px; width: 44px; height: 44px; border-radius: 14px; background: rgba(17,24,58,.9); border: 1px solid #2A3470; color: #F3F5FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 6-6 6 6 6"></path></svg></a>
</div>
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; margin-top: -22px; position: relative; border-radius: 28px 28px 0 0; background: #070B1F; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #1A2350; color: #D5DBF7; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">Parada 1 de 24</span>
<span style="height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(52,211,153,.14); color: #6EE7B7; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #34D399"></span>Recibe el 86 %</span>
</div>
<h1 style="margin: 2px 0 0; font-size: 23px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em">Av. San Martín 1450</h1>
<span style="font-size: 14px; color: #A3AED6">Lucía Fernández · Timbre B, si no atiende dejar en portería</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Ficha.dc.html" style="height: 56px; border-radius: 16px; border: 1px solid #2A3470; background: #1A2350; color: #F3F5FF; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7FB0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Llamar</a>
<a href="Ficha.dc.html" style="height: 56px; border-radius: 16px; border: 1px solid #2A3470; background: #1A2350; color: #F3F5FF; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20l1.3-5A8.4 8.4 0 1 1 21 11.5Z"></path></svg>WhatsApp</a>
<a href="Ficha.dc.html" style="height: 56px; border-radius: 16px; border: 1px solid #2A3470; background: #1A2350; color: #F3F5FF; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"></path></svg>Navegar</a>
</div>
<a href="Visita.dc.html" style="height: 52px; border-radius: 16px; border: 1.5px solid #7C5CFF; background: rgba(124,92,255,.12); color: #E9E3FF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg>Llegué: iniciar visita</a>
<section style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #A3AED6">Resultado</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{pickOk}}" aria-pressed="{{okPressed}}" style="height: 64px; border-radius: 18px; border: 2px solid {{okBorder}}; background: {{okBg}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Entregado</button>
<button type="button" onClick="{{pickNo}}" aria-pressed="{{noPressed}}" style="height: 64px; border-radius: 18px; border: 2px solid {{noBorder}}; background: {{noBg}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>No entregado</button>
</div>
<sc-if value="{{showReasons}}" hint-placeholder-val="{{ true }}">
<div class="rc-open" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600; color: #D5DBF7">¿Por qué no se entregó?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="6">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{r.border}}; background: {{r.bg}}; color: #F3F5FF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{r.label}}</button>
</sc-for>
</div>
<button type="button" style="height: 56px; border-radius: 16px; border: 1.5px dashed #5A67B0; background: rgba(124,92,255,.08); color: #D5DBF7; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Sacar foto como comprobante</button>
</div>
</sc-if>
<sc-if value="{{showSave}}" hint-placeholder-val="{{ false }}">
<a href="Paquetes.dc.html" class="rc-open" style="height: 60px; border-radius: 18px; background: #7C5CFF; color: #FFFFFF; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 12px 32px rgba(124,92,255,.40)">Guardar y seguir a la parada 2</a>
</sc-if>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { result: 'no', reason: 'absent' };
}
renderVals() {
const res = this.state.result;
const on = (x) => res === x;
const list = [['absent', 'Ausente'], ['noanswer', 'Nadie responde'], ['address', 'Dirección incorrecta'], ['access', 'Acceso imposible'], ['resched', 'Pide otro día'], ['other', 'Otro']];
return {
okPressed: on('ok') ? 'true' : 'false',
noPressed: on('no') ? 'true' : 'false',
okBorder: on('ok') ? '#34D399' : '#2A3470',
okBg: on('ok') ? 'rgba(52,211,153,.18)' : '#11183A',
noBorder: on('no') ? '#FBBF24' : '#2A3470',
noBg: on('no') ? 'rgba(251,191,36,.14)' : '#11183A',
pickOk: () => this.setState({ result: 'ok' }),
pickNo: () => this.setState({ result: 'no' }),
showReasons: on('no'),
showSave: res !== null,
reasons: list.map(([k, label]) => ({
label,
pressed: this.state.reason === k ? 'true' : 'false',
border: this.state.reason === k ? '#FBBF24' : '#2A3470',
bg: this.state.reason === k ? 'rgba(251,191,36,.16)' : '#11183A',
pick: () => this.setState({ reason: k })
}))
};
}
}
</script>
</body>
</html>
