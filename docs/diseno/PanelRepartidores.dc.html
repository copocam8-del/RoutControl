<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel: repartidores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B1F}
a{color:#A78BFA}a:hover{color:#C4B5FD}
input::placeholder{color:#7F8AB8}
input:focus{outline:none;border-color:#7C5CFF !important;box-shadow:0 0 0 4px rgba(124,92,255,.28)}
</style>
</helmet>
<div style="min-height: 1000px; box-sizing: border-box; background: #070B1F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3F5FF; display: flex; flex-wrap: wrap">
<aside style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; padding: 28px 18px; background: #0B1130; border-right: 1px solid #1A2350; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<div style="width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(140deg, #4D8DFF 0%, #7C5CFF 100%); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 60 60" fill="none" aria-hidden="true"><path d="M14 44 C 14 30, 30 34, 30 24 S 44 16, 46 14" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path><circle cx="14" cy="44" r="7" fill="#FFFFFF"></circle><circle cx="46" cy="14" r="8" fill="#0B1130" stroke="#FFFFFF" stroke-width="5"></circle></svg></div>
<div style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em">Route<span style="color: #A78BFA">Control</span></div>
</div>
<nav aria-label="Secciones" style="display: flex; flex-direction: column; gap: 6px">
<a href="Panel.dc.html" style="height: 48px; padding: 0 14px; border-radius: 14px; color: #A3AED6; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 12px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"></rect><rect x="14" y="3" width="7" height="5" rx="2"></rect><rect x="14" y="12" width="7" height="9" rx="2"></rect><rect x="3" y="16" width="7" height="5" rx="2"></rect></svg>Inicio</a>
<a href="PanelJornadas.dc.html" style="height: 48px; padding: 0 14px; border-radius: 14px; color: #A3AED6; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 12px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>Jornadas</a>
<a href="PanelRepartidores.dc.html" aria-current="page" style="height: 48px; padding: 0 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(124,92,255,.30), rgba(124,92,255,.10)); color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 12px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21a7 7 0 0 0-4-6.3"></path></svg>Repartidores</a>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<div style="padding: 14px; border-radius: 16px; background: #11183A; border: 1px solid #1F2860; display: flex; align-items: center; gap: 12px">
<div style="width: 40px; height: 40px; border-radius: 50%; background: #1A2350; border: 2px solid #7C5CFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #C4B5FD">CC</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 700">Camila Copo</span><span style="font-size: 12px; color: #A3AED6">Dueña · Demo Norte</span></div>
</div>
<a href="PanelLogin.dc.html" style="height: 44px; border-radius: 12px; color: #A3AED6; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5"></path><path d="M5 12h11"></path></svg>Salir</a>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Repartidores</h1>
<span style="font-size: 15px; color: #A3AED6">5 repartidores en Demo Norte</span>
</div>
<div style="position: relative; flex: 0 1 340px">
<label for="buscar" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar repartidor</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3AED6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 14px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="buscar" type="search" placeholder="Buscar por nombre o email" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 14px; border: 1.5px solid #5A67B0; background: #11183A; color: #F3F5FF; font-family: inherit; font-size: 15px; padding: 0 16px 0 46px">
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px">
<sc-for list="{{drivers}}" as="d" hint-placeholder-count="5">
<article style="border-radius: 22px; background: #11183A; border: 1px solid {{d.border}}; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 52px; height: 52px; border-radius: 50%; background: {{d.avatarBg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #FFFFFF">{{d.ini}}</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 800">{{d.name}}</span>
<span style="font-size: 13px; color: #A3AED6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{d.email}}</span>
</div>
</div>
<span style="align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 999px; background: {{d.badgeBg}}; color: {{d.badgeFg}}; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{d.dot}}"></span>{{d.state}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 12px; border-radius: 14px; background: #1A2350; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3AED6">Jornada</span><span style="font-size: 15px; font-weight: 700">{{d.since}}</span></div>
<div style="padding: 12px; border-radius: 14px; background: #1A2350; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3AED6">Última señal</span><span style="font-size: 15px; font-weight: 700">{{d.last}}</span></div>
</div>
<a href="PanelJornadas.dc.html" style="height: 46px; border-radius: 14px; border: 1px solid #2A3470; background: #1A2350; color: #F3F5FF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">{{d.cta}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a>
</article>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const S = {
on: { state: 'En jornada', badgeBg: 'rgba(52,211,153,.14)', badgeFg: '#6EE7B7', dot: '#34D399', border: '#1F2860', avatarBg: 'linear-gradient(140deg, #4D8DFF, #7C5CFF)', cta: 'Ver recorrido de hoy' },
nosig: { state: 'Sin señal', badgeBg: 'rgba(251,191,36,.14)', badgeFg: '#FCD34D', dot: '#FBBF24', border: 'rgba(251,191,36,.45)', avatarBg: 'linear-gradient(140deg, #4D8DFF, #7C5CFF)', cta: 'Ver recorrido de hoy' },
off: { state: 'Sin jornada', badgeBg: '#1A2350', badgeFg: '#D5DBF7', dot: '#7F8AB8', border: '#1F2860', avatarBg: '#2A3470', cta: 'Ver última jornada' }
};
const list = [
{ ini: 'R1', name: 'Repartidor 1', email: 'repartidor1@norte.demo', s: 'on', since: 'Desde 08:12', last: 'Hace 1 min' },
{ ini: 'R2', name: 'Repartidor 2', email: 'repartidor2@norte.demo', s: 'nosig', since: 'Desde 08:30', last: 'Hace 14 min' },
{ ini: 'R3', name: 'Repartidor 3', email: 'repartidor3@norte.demo', s: 'on', since: 'Desde 07:45', last: 'Hace 2 min' },
{ ini: 'R4', name: 'Repartidor 4', email: 'repartidor4@norte.demo', s: 'on', since: 'Desde 09:05', last: 'Hace 3 min' },
{ ini: 'R5', name: 'Repartidor 5', email: 'repartidor5@norte.demo', s: 'off', since: 'No empezó', last: 'Ayer 17:20' }
];
return { drivers: list.map((d) => ({ ...d, ...S[d.s] })) };
}
}
</script>
</body>
</html>
